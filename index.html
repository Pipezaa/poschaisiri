<!DOCTYPE html>
<html lang="th">
<head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    
    <!-- 1. Viewport ปรับปรุงใหม่ให้รองรับการแสดงผลแบบเต็มจอและรอยบาก (Notch) ของ iPhone -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <title>POS System Chaisiri</title>

    <!-- 2. PWA & Mobile Meta Tags ทั่วไป -->
    <meta name="theme-color" content="#f4f7f6"> <!-- สีของแถบด้านบนเบราว์เซอร์ -->
    <meta name="mobile-web-app-capable" content="yes"> <!-- ทำให้ Android แอดลงหน้าจอโฮมได้ดีขึ้น -->

    <!-- 3. Apple Specific Meta Tags (สำหรับ iPhone/iPad โดยเฉพาะ) -->
    <meta name="apple-mobile-web-app-capable" content="yes"> <!-- ซ่อนแถบ URL เมื่อเปิดจาก Home Screen (Standalone Mode) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"> <!-- รูปแบบแถบสถานะด้านบน -->
    <meta name="apple-mobile-web-app-title" content="POS Chaisiri"> <!-- ชื่อสั้นๆ ที่จะแสดงบนหน้าจอ iPhone -->
    
    <!-- ใส่รูปภาพ Icon สำหรับ Apple (ต้องเอารูปขนาด 192x192 อัปโหลดลง Github ด้วย) -->
    <link rel="apple-touch-icon" href="icon-192x192.png"> 

    <!-- 4. เรียกใช้ Manifest File (ที่คุณสามารถสร้างเองได้) -->
    <link rel="manifest" href="manifest.json">

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            overflow: hidden; /* ป้องกันไม่ให้หน้าหลักเลื่อนได้ ให้เลื่อนได้แค่ใน iframe */
        }

        iframe {
            width: 100%;
            height: 100vh;
            border: none;
            /* รองรับพื้นที่ปลอดภัยของ iPhone (พวกที่มีรอยบากหรือแถบโฮมด้านล่าง) */
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <!-- iframe ที่จะใช้ฝัง App Script ของเรา -->
    <iframe id="app-iframe" src="" allow="camera; microphone; display-capture; clipboard-read; clipboard-write; geolocation" allowfullscreen></iframe>

    <script>
        // URL ของ App Script ที่ได้จากการ Deploy
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzuAoteT9I7knF_PwtVNmlwKM5v0ultveceBmgSLikbqge1VWrWhALllbJP-U9Bs0yJZg/exec';

        const iframe = document.getElementById('app-iframe');
        const params = window.location.search;
        const iframeSrc = APPS_SCRIPT_URL + params;
        iframe.src = iframeSrc;

        console.log('Redirecting to iframe with src:', iframeSrc);
    </script>
</body>
</html>
