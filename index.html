<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PWA Fullscreen</title>
    
    <!-- iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MyPWA">
    
    <link rel="manifest" href="manifest.json">
    
    <style>
        :root {
            --primary-color: #007AFF;
            --bg-color: #0f172a;
            --text-color: #f8fafc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            width: 100%;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        }

        header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }

        nav {
            height: 60px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .nav-item {
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .nav-item.active { color: var(--primary-color); }

        .card {
            background: rgba(255,255,255,0.05);
            padding: 24px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 20px;
        }

        .btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            width: 100%;
            font-size: 16px;
        }

        /* คลาสสำหรับซ่อนปุ่มเมื่อติดตั้งแล้ว */
        .hidden { display: none; }

        .no-select {
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body class="no-select">

    <div class="app-container">
        <header>
            <strong id="status-text">PWA Experience</strong>
        </header>

        <main>
            <div class="card">
                <h1 id="welcome-msg">ยินดีต้อนรับ</h1>
                <p>สัมผัสประสบการณ์ใช้งานแบบเต็มหน้าจอไร้ขอบบน iPhone ของคุณ</p>
            </div>
            
            <!-- ปุ่มนี้จะถูกซ่อนถ้าเปิดผ่าน Standalone Mode -->
            <div id="install-area">
                <button class="btn" onclick="installApp()">แตะเพื่อติดตั้งบน iPhone</button>
                <p style="margin-top: 15px; font-size: 13px;">(Share > Add to Home Screen)</p>
            </div>
        </main>

        <nav>
            <a href="#" class="nav-item active"><span>🏠</span><span>หน้าหลัก</span></a>
            <a href="#" class="nav-item"><span>👤</span><span>โปรไฟล์</span></a>
            <a href="#" class="nav-item"><span>⚙️</span><span>ตั้งค่า</span></a>
        </nav>
    </div>

    <script>
        // ฟังก์ชันตรวจสอบสถานะ Standalone
        function checkStandalone() {
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
            
            // ตรวจสอบ standalone บน iOS หรือ display-mode บน Browser ทั่วไป
            const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;

            if (isStandalone) {
                // ถ้าอยู่ในโหมดแอปแล้ว
                document.getElementById('install-area').classList.add('hidden');
                document.getElementById('status-text').innerText = 'Standalone Mode';
                document.getElementById('welcome-msg').innerText = 'คุณกำลังใช้งานผ่านแอป';
            }
        }

        // Service Worker Setup
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = `
                    self.addEventListener('install', (e) => self.skipWaiting());
                    self.addEventListener('fetch', (e) => e.respondWith(fetch(e.request)));
                `;
                const blob = new Blob([swCode], { type: 'application/javascript' });
                navigator.serviceWorker.register(URL.createObjectURL(blob));
            });
        }

        function installApp() {
            alert('วิธีติดตั้ง:\n1. แตะปุ่ม "แชร์" ด้านล่างหน้าจอ\n2. เลือก "เพิ่มไปยังหน้าจอโฮม"');
        }

        // รันการตรวจสอบเมื่อโหลดหน้าเว็บ
        window.onload = checkStandalone;
    </script>
</body>
</html>
